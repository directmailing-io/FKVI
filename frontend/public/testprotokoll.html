<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FKVI Testprotokoll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a2e; min-height: 100vh; }

  /* Header */
  .header { background: #1a3a5c; color: white; padding: 28px 32px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 16px rgba(0,0,0,0.18); }
  .header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.3px; }
  .header p { font-size: 0.8rem; opacity: 0.7; margin-top: 2px; }
  .progress-box { background: rgba(255,255,255,0.12); border-radius: 12px; padding: 10px 18px; text-align: center; min-width: 160px; }
  .progress-box .nums { font-size: 1.5rem; font-weight: 800; line-height: 1; }
  .progress-box .label { font-size: 0.7rem; opacity: 0.75; margin-top: 2px; letter-spacing: 0.5px; text-transform: uppercase; }
  .progress-bar-wrap { height: 5px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #0d9488; border-radius: 4px; transition: width 0.3s; }

  /* Controls */
  .controls { max-width: 960px; margin: 20px auto 0; padding: 0 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .controls input { flex: 1; min-width: 200px; padding: 9px 14px; border-radius: 8px; border: 1.5px solid #dde3ea; font-size: 0.88rem; background: white; }
  .controls input:focus { outline: none; border-color: #1a3a5c; }
  .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: all 0.15s; }
  .btn-reset { background: #fee2e2; color: #b91c1c; }
  .btn-reset:hover { background: #fecaca; }
  .btn-expand { background: #e0e7ff; color: #3730a3; }
  .btn-expand:hover { background: #c7d2fe; }
  .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 12px; border-radius: 20px; border: 1.5px solid #dde3ea; background: white; cursor: pointer; font-size: 0.78rem; font-weight: 600; transition: all 0.15s; color: #64748b; }
  .filter-btn.active { background: #1a3a5c; color: white; border-color: #1a3a5c; }

  /* Main */
  main { max-width: 960px; margin: 16px auto 60px; padding: 0 24px; }

  /* Category */
  .category { margin-bottom: 16px; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.07); }
  .category-header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: white; cursor: pointer; user-select: none; border-bottom: 1px solid #f1f5f9; transition: background 0.1s; }
  .category-header:hover { background: #f8fafc; }
  .category-icon { font-size: 1.2rem; width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .category-title { font-size: 0.97rem; font-weight: 700; flex: 1; }
  .category-stats { font-size: 0.75rem; color: #64748b; font-weight: 600; white-space: nowrap; }
  .cat-ok { color: #059669; }
  .cat-fail { color: #dc2626; }
  .chevron { transition: transform 0.2s; color: #94a3b8; font-size: 0.85rem; }
  .chevron.open { transform: rotate(180deg); }
  .category-body { display: none; background: white; }
  .category-body.open { display: block; }

  /* Item */
  .item { border-top: 1px solid #f1f5f9; padding: 14px 18px 14px 18px; display: flex; gap: 14px; align-items: flex-start; transition: background 0.1s; }
  .item:hover { background: #fafbfc; }
  .item.status-ok { border-left: 3px solid #10b981; }
  .item.status-fail { border-left: 3px solid #ef4444; }
  .item.status-none { border-left: 3px solid transparent; }
  .item-num { font-size: 0.7rem; color: #94a3b8; font-weight: 700; min-width: 22px; margin-top: 2px; }
  .item-content { flex: 1; min-width: 0; }
  .item-title { font-size: 0.9rem; font-weight: 700; color: #1e293b; margin-bottom: 3px; }
  .item-desc { font-size: 0.8rem; color: #64748b; line-height: 1.5; }
  .item-note { margin-top: 6px; width: 100%; padding: 5px 9px; border-radius: 6px; border: 1.5px solid #e2e8f0; font-size: 0.78rem; color: #475569; resize: vertical; min-height: 32px; font-family: inherit; background: #f8fafc; }
  .item-note:focus { outline: none; border-color: #1a3a5c; background: white; }
  .item-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; }
  .check-btn { display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 8px; border: 1.5px solid; cursor: pointer; font-size: 0.75rem; font-weight: 700; transition: all 0.15s; white-space: nowrap; }
  .check-ok { border-color: #10b981; color: #059669; background: white; }
  .check-ok:hover, .check-ok.active { background: #ecfdf5; border-color: #059669; }
  .check-ok.active { background: #d1fae5; }
  .check-fail { border-color: #ef4444; color: #dc2626; background: white; }
  .check-fail:hover, .check-fail.active { background: #fef2f2; border-color: #dc2626; }
  .check-fail.active { background: #fee2e2; }
  .priority-badge { font-size: 0.65rem; font-weight: 800; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.4px; }
  .prio-high { background: #fef3c7; color: #d97706; }
  .prio-med { background: #e0e7ff; color: #4338ca; }

  /* Empty state */
  .empty { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 0.88rem; }

  /* Summary bar */
  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .summary-card { flex: 1; min-width: 100px; background: white; border-radius: 10px; padding: 12px 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .summary-card .val { font-size: 1.6rem; font-weight: 800; }
  .summary-card .lbl { font-size: 0.72rem; color: #64748b; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }
  .val-total { color: #1a3a5c; }
  .val-ok { color: #059669; }
  .val-fail { color: #dc2626; }
  .val-open { color: #d97706; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <h1>FKVI Testprotokoll</h1>
      <p>Vollständige Qualitätsprüfung aller Plattform-Funktionen</p>
    </div>
    <div class="progress-box">
      <div class="nums" id="progressNums">0 / 0</div>
      <div class="label">Tests abgeschlossen</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Suche nach Test..." oninput="applyFilters()">
  <div class="filter-btns">
    <button class="filter-btn active" onclick="setFilter('all', this)">Alle</button>
    <button class="filter-btn" onclick="setFilter('open', this)">Offen</button>
    <button class="filter-btn" onclick="setFilter('ok', this)">OK</button>
    <button class="filter-btn" onclick="setFilter('fail', this)">Fehler</button>
    <button class="filter-btn" onclick="setFilter('high', this)">Kritisch</button>
  </div>
  <button class="btn btn-expand" onclick="toggleAll(true)">Alle aufklappen</button>
  <button class="btn btn-expand" onclick="toggleAll(false)">Alle zuklappen</button>
  <button class="btn btn-reset" onclick="resetAll()">Zurücksetzen</button>
</div>

<main id="main">
  <div class="summary">
    <div class="summary-card"><div class="val val-total" id="sumTotal">0</div><div class="lbl">Gesamt</div></div>
    <div class="summary-card"><div class="val val-ok" id="sumOk">0</div><div class="lbl">Bestanden</div></div>
    <div class="summary-card"><div class="val val-fail" id="sumFail">0</div><div class="lbl">Fehler</div></div>
    <div class="summary-card"><div class="val val-open" id="sumOpen">0</div><div class="lbl">Offen</div></div>
  </div>
  <!-- categories rendered by JS -->
</main>

<script>

  {
    id: 'zugang',
    icon: '🔐',

      { id: 'pw-forgot', prio: 'med', title: '"Passwort vergessen"-Funktion', desc: 'Klicke auf der Login-Seite auf "Passwort vergessen", gib deine E-Mail-Adresse ein und prüfe, ob eine Reset-E-Mail ankommt.' },
      { id: 'session-persist', prio: 'med', title: 'Sitzung bleibt erhalten', desc: 'Melde dich an, schließe den Browser-Tab, öffne ihn wieder und rufe die Plattform auf – du solltest noch eingeloggt sein (nicht erneut nach Passwort gefragt werden).' },

  },
  {

      { id: 'fk-new', prio: 'high', title: 'Neues Profil anlegen', desc: 'Klicke auf "Neues Profil" oder "+". Fülle alle Pflichtfelder aus (Name, E-Mail, etc.) und speichere. Das Profil sollte in der Liste erscheinen.' },
      { id: 'fk-edit', prio: 'high', title: 'Profil bearbeiten', desc: 'Öffne ein vorhandenes Profil und ändere verschiedene Felder (z.B. Telefonnummer, Adresse, Ausbildung). Speichere und prüfe, ob die Änderungen übernommen wurden.' },
      { id: 'fk-status', prio: 'high', title: 'Profil-Status ändern', desc: 'Ändere den Status eines Profils (z.B. von "Neu" auf "Aktiv" oder "Vermittelt"). Der neue Status sollte in der Liste und im Profil angezeigt werden.' },

      { id: 'fk-competency', prio: 'high', title: 'FKVI-Kompetenznachweis setzen', desc: 'Setze den FKVI-Kompetenznachweis auf "Bestanden" – im Profil sollte ein grünes Badge erscheinen. Setze ihn auf "In Aneignung" – Badge wird orange/gelb. Kein Badge bei nicht gesetzt.' },
      { id: 'fk-search', prio: 'med', title: 'Profil suchen/filtern', desc: 'Nutze die Suche oder Filter-Funktion, um ein bestimmtes Profil zu finden (z.B. nach Name oder Status).' },
      { id: 'fk-delete', prio: 'med', title: 'Profil löschen / archivieren', desc: 'Archiviere oder lösche ein Test-Profil. Es sollte aus der aktiven Liste verschwinden.' },

      { id: 'fk-doc-send-view', prio: 'high', title: 'Dokument als Ansichts-Link verschicken', desc: 'Klicke auf "Dokument senden" bei einem hochgeladenen Profil-Dokument, wähle "Zur Ansicht senden" und erstelle den Link. Öffne den Link in einem neuen Tab – das Dokument sollte angezeigt werden.' },

      { id: 'verm-status', prio: 'high', title: 'Prozess-Status ändern (Schritt 1–11)', desc: 'Ändere den Prozess-Status der Vermittlung schrittweise (z.B. von Schritt 1 auf Schritt 2, dann 3, usw.). Jeder Schritt sollte korrekt angezeigt und gespeichert werden.' },

// State
let state = {};
let currentFilter = 'all';

function init() {
  // Load from localStorage
  try { state = JSON.parse(localStorage.getItem('fkvi-test-state') || '{}'); } catch(e) { state = {}; }
  renderAll();
}

function save() {
  localStorage.setItem('fkvi-test-state', JSON.stringify(state));
  updateStats();
}

function getItemState(id) {
  return state[id] || { status: 'none', note: '' };
}

function setStatus(id, status) {
  const s = getItemState(id);
  s.status = (s.status === status) ? 'none' : status;
  state[id] = s;
  save();
  renderItem(id);
  renderCategoryStats();
}

function setNote(id, note) {
  const s = getItemState(id);
  s.note = note;
  state[id] = s;
  save();
}

function renderAll() {
  const main = document.getElementById('main');
  // Keep summary
  const summary = main.querySelector('.summary');
  main.innerHTML = '';
  main.appendChild(summary);

  let anyVisible = false;
  DATA.forEach(cat => {
    const el = renderCategory(cat);
    if (el) { main.appendChild(el); anyVisible = true; }
  });

  if (!anyVisible) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Keine Tests gefunden.';
    main.appendChild(empty);
  }
  updateStats();
}

function matchesFilter(item) {
  const s = getItemState(item.id);
  const q = document.getElementById('searchInput').value.toLowerCase();
  const matchSearch = !q || item.title.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
  let matchFilter = true;
  if (currentFilter === 'open') matchFilter = s.status === 'none';
  if (currentFilter === 'ok') matchFilter = s.status === 'ok';
  if (currentFilter === 'fail') matchFilter = s.status === 'fail';
  if (currentFilter === 'high') matchFilter = item.prio === 'high';
  return matchSearch && matchFilter;
}

function renderCategory(cat) {
  const visibleItems = cat.items.filter(matchesFilter);
  if (visibleItems.length === 0) return null;

  const div = document.createElement('div');
  div.className = 'category';
  div.id = 'cat-' + cat.id;

  const okCount = cat.items.filter(i => getItemState(i.id).status === 'ok').length;
  const failCount = cat.items.filter(i => getItemState(i.id).status === 'fail').length;
  const totalCount = cat.items.length;

  const isOpen = localStorage.getItem('cat-' + cat.id) !== 'closed';

  div.innerHTML = `
    <div class="category-header" onclick="toggleCat('${cat.id}')">
      <div class="category-icon" style="background:${cat.color}">${cat.icon}</div>
      <div class="category-title">${cat.title}</div>
      <div class="category-stats">
        <span class="cat-ok">${okCount} ✓</span> &nbsp;
        <span class="cat-fail">${failCount > 0 ? failCount + ' ✗' : ''}</span>
        <span style="color:#94a3b8"> / ${totalCount}</span>
      </div>
      <span class="chevron ${isOpen ? 'open' : ''}">▼</span>
    </div>
    <div class="category-body ${isOpen ? 'open' : ''}" id="catbody-${cat.id}"></div>
  `;

  const body = div.querySelector('.category-body');
  visibleItems.forEach((item, idx) => {
    const itemEl = buildItemEl(item, idx + 1);
    body.appendChild(itemEl);
  });

  return div;
}

function buildItemEl(item, num) {
  const s = getItemState(item.id);
  const div = document.createElement('div');
  div.className = `item status-${s.status}`;
  div.id = 'item-' + item.id;

  div.innerHTML = `
    <div class="item-num">#${num}</div>
    <div class="item-content">
      <div class="item-title">
        ${item.title}
        ${item.prio === 'high' ? '<span class="priority-badge prio-high">Kritisch</span>' : '<span class="priority-badge prio-med">Normal</span>'}
      </div>
      <div class="item-desc">${item.desc}</div>
      <textarea class="item-note" placeholder="Notiz / Fehlerbeschreibung..." rows="1"
        oninput="setNote('${item.id}', this.value)">${s.note || ''}</textarea>
    </div>
    <div class="item-actions">
      <button class="check-btn check-ok ${s.status === 'ok' ? 'active' : ''}" onclick="setStatus('${item.id}', 'ok')">
        ✓ OK
      </button>
      <button class="check-btn check-fail ${s.status === 'fail' ? 'active' : ''}" onclick="setStatus('${item.id}', 'fail')">
        ✗ Fehler
      </button>
    </div>
  `;
  return div;
}

function renderItem(id) {
  const oldEl = document.getElementById('item-' + id);
  if (!oldEl) return;
  const allItems = DATA.flatMap(c => c.items);
  const item = allItems.find(i => i.id === id);
  if (!item) return;
  const s = getItemState(id);
  oldEl.className = `item status-${s.status}`;
  oldEl.querySelector('.check-ok').className = `check-btn check-ok ${s.status === 'ok' ? 'active' : ''}`;
  oldEl.querySelector('.check-fail').className = `check-btn check-fail ${s.status === 'fail' ? 'active' : ''}`;
}

function renderCategoryStats() {
  DATA.forEach(cat => {
    const el = document.getElementById('cat-' + cat.id);
    if (!el) return;
    const okCount = cat.items.filter(i => getItemState(i.id).status === 'ok').length;
    const failCount = cat.items.filter(i => getItemState(i.id).status === 'fail').length;
    const totalCount = cat.items.length;
    const statsEl = el.querySelector('.category-stats');
    if (statsEl) {
      statsEl.innerHTML = `
        <span class="cat-ok">${okCount} ✓</span> &nbsp;
        <span class="cat-fail">${failCount > 0 ? failCount + ' ✗' : ''}</span>
        <span style="color:#94a3b8"> / ${totalCount}</span>
      `;
    }
  });
}

function updateStats() {
  const allItems = DATA.flatMap(c => c.items);
  const total = allItems.length;
  const ok = allItems.filter(i => getItemState(i.id).status === 'ok').length;
  const fail = allItems.filter(i => getItemState(i.id).status === 'fail').length;
  const open = total - ok - fail;
  const done = ok + fail;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById('sumTotal').textContent = total;
  document.getElementById('sumOk').textContent = ok;
  document.getElementById('sumFail').textContent = fail;
  document.getElementById('sumOpen').textContent = open;
  document.getElementById('progressNums').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = pct + '%';
}

function toggleCat(id) {
  const body = document.getElementById('catbody-' + id);
  const header = document.querySelector('#cat-' + id + ' .category-header');
  const chevron = header.querySelector('.chevron');
  const isOpen = body.classList.contains('open');
  if (isOpen) {
    body.classList.remove('open');
    chevron.classList.remove('open');
    localStorage.setItem('cat-' + id, 'closed');
  } else {
    body.classList.add('open');
    chevron.classList.add('open');
    localStorage.removeItem('cat-' + id);
  }
}

function toggleAll(open) {
  DATA.forEach(cat => {
    const body = document.getElementById('catbody-' + cat.id);
    const header = document.querySelector('#cat-' + cat.id + ' .category-header');
    if (!body || !header) return;
    const chevron = header.querySelector('.chevron');
    if (open) {
      body.classList.add('open');
      chevron.classList.add('open');
      localStorage.removeItem('cat-' + cat.id);
    } else {
      body.classList.remove('open');
      chevron.classList.remove('open');
      localStorage.setItem('cat-' + cat.id, 'closed');
    }
  });
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  renderAll();
}

function resetAll() {
  if (!confirm('Wirklich alle Testergebnisse und Notizen löschen?')) return;
  localStorage.removeItem('fkvi-test-state');
  state = {};
  renderAll();
}

init();
</script>
